name: Validate and deploy content

on:
  push:
    branches: [main]
  pull_request:
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-content-${{ github.event.pull_request.number || github.ref || github.event_name }}
  cancel-in-progress: true

jobs:
  validate-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run content:build:fixture
      - run: npm test
      - run: npm run site:build
      - run: npm run site:check

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and validate GitHub Issue content
        id: content
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run content:build -- --report-file .content-validation-report.json
      - name: Create or update validation comments
        if: steps.content.outcome == 'failure' && hashFiles('.content-validation-report.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- snxq-content-validation -->';
            const report = JSON.parse(fs.readFileSync('.content-validation-report.json', 'utf8'));
            if (report.marker !== 'snxq-content-validation' || !Array.isArray(report.errors)) {
              core.setFailed('Content validation report has an unexpected format.');
              return;
            }

            const errorsByIssue = new Map();
            for (const error of report.errors) {
              if (!Number.isInteger(error.issueNumber) || error.issueNumber < 1) {
                core.setFailed(`Validation error is not associated with an Issue: ${JSON.stringify(error)}`);
                return;
              }
              const errors = errorsByIssue.get(error.issueNumber) ?? [];
              errors.push(error);
              errorsByIssue.set(error.issueNumber, errors);
            }

            for (const [issueNumber, errors] of errorsByIssue) {
              const details = errors.map(error =>
                `- **${error.field}**: ${error.reason}`
              ).join('\n');
              const body = `${marker}\nContent validation failed. Fix the following publication errors, then update the Issue:\n\n${details}`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100
              });
              const previous = comments.find(comment =>
                comment.user?.type === 'Bot' && comment.body?.includes(marker)
              );
              if (previous) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: previous.id,
                  body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body
                });
              }
            }
      - name: Stop after content build failure
        if: steps.content.outcome == 'failure'
        run: exit 1
      - run: npm test
      - run: npm run site:build
      - run: npm run site:check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
