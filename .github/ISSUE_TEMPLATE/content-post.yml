name: Content — Post
description: Publish one long-form article.
title: "[post] "
labels: ["content:post"]
body:
  - type: input
    id: slug
    attributes:
      label: Slug
      description: Optional lowercase letters, numbers, and hyphens. Blank becomes issue-<number>.
      placeholder: "quiet-systems"
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date
      description: Date in YYYY-MM-DD format.
      placeholder: "2026-07-24"
    validations:
      required: true
  - type: textarea
    id: tags
    attributes:
      label: Tags
      description: Comma-separated display tags.
  - type: input
    id: cover-image-url
    attributes:
      label: Cover Image URL
      description: Optional HTTPS URL.
  - type: textarea
    id: body
    attributes:
      label: Body
      description: GitHub Flavored Markdown. Raw HTML is rejected.
    validations:
      required: true
